# Publish the site to GitHub Pages on every push to the default branch (or by hand from the Actions tab).
# Replaces the built-in "pages build and deployment", whose deploy step gives up after 10 minutes: the site's ~850 data
# files (~320 MB) took longer than that to sync. Needs Settings -> Pages -> Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [add_mouse_brain_widget]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits rather than cancelling one in progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The site is static files as they are in the repo (.nojekyll: no Jekyll build); .git and .github are left out
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # 30 minutes in ms (default 10)
          timeout: 1800000
