<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raindrop</title>
  <link rel="stylesheet" href="style.css">
  <!-- three.js is vendored, so the viewer works without a CDN; scene.js imports it as 'three' -->
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <aside id="sidebar">
    <h1 id="title">Raindrop</h1>
    <div id="count"></div>

    <section>
      <h2>View</h2>
      <div class="view-count">
        <label>Views <select id="view-count" aria-label="Number of views"></select></label>
      </div>
      <select id="embedding" aria-label="Embedding"></select>
      <table id="faces" aria-label="Show a side of the data"></table>
      <label class="turn-about" id="turn-about-row">Turn about <select id="turn-about" aria-label="Axis drags turn about"></select></label>
      <p class="hint" id="drag-hint">Shift+drag: spin or tilt only (the main direction)</p>
      <table id="rotation" aria-label="Rotation: slider, angle and reset per axis"></table>
      <button id="reset-rotation" title="Set every angle to 0 degrees">Reset rotation</button>
      <label class="slider">Show axes <input id="show-axes" type="checkbox" checked></label>
      <!-- Point size and opacity of the cells passing the filters (Shown) and of the filtered-out cells, each slider
           with a number box (app.js) to read or type the value: the point diameter in CSS px when the view is framed
           (disabled until then), opacities in percent. Phones show a decimal keypad (inputmode; no value is
           negative): Android's has a Done key (enterkeyhint) that sends Enter, the iPhone's has none, and its
           keyboard bar's Done leaves the box. A dataset can set their starting values (convert.py
           --start-style, which checks sizes against the size sliders' range, -4 to 3 in log2) -->
      <table id="cell-styles" aria-label="Point size and opacity of shown and filtered-out cells">
        <colgroup><col class="group"><col><col class="box"><col><col class="box"></colgroup>
        <thead><tr><th></th><th colspan="2">Point size (px)</th><th colspan="2">Opacity (%)</th></tr></thead>
        <tbody>
          <tr>
            <th>Shown</th>
            <td><input id="point-size" type="range" min="-4" max="3" step="0.1" value="0" title="Point size of shown cells (log scale)"></td>
            <td><input id="point-size-box" type="number" step="0.1" inputmode="decimal" enterkeyhint="done" disabled title="Diameter when the whole view is in frame, in CSS px"></td>
            <td><input id="shown-opacity" type="range" min="0" max="1" step="0.01" value="1" title="Opacity of shown cells. Below 100% the nearest cell stays on top; cells behind show through only where they were drawn earlier. Points smaller than a pixel blend in the order cells are stored"></td>
            <td><input id="shown-opacity-box" type="number" min="0" max="100" step="1" inputmode="decimal" enterkeyhint="done" title="Opacity in percent"></td>
          </tr>
          <tr>
            <th>Filtered out</th>
            <td><input id="context-point-size" type="range" min="-4" max="3" step="0.1" value="0" title="Point size of filtered-out cells (log scale). Points smaller than a pixel are drawn a pixel wide and fainter, by the share of the pixel they cover"></td>
            <td><input id="context-point-size-box" type="number" step="0.1" inputmode="decimal" enterkeyhint="done" disabled title="Diameter when the whole view is in frame, in CSS px"></td>
            <td><input id="context-opacity" type="range" min="0" max="1" step="0.01" value="0.08" title="Opacity of filtered-out cells. Below 100% they blend over shown cells behind them. Opaque shown cells hide them, and stay on top at equal depth while their points are at least a pixel wide"></td>
            <td><input id="context-opacity-box" type="number" min="0" max="100" step="1" inputmode="decimal" enterkeyhint="done" title="Opacity in percent"></td>
          </tr>
        </tbody>
      </table>
      <label class="slider">Filtered-out cells keep their colors <input id="context-colors" type="checkbox" checked></label>
    </section>

    <section>
      <h2>Color by</h2>
      <select id="color-field" aria-label="Color by column"></select>
      <div class="gene-box" id="gene-box">
        <select id="gene-source" aria-label="Gene source"></select>
        <input id="gene" list="gene-list" placeholder="or type a gene" autocomplete="off">
        <datalist id="gene-list"></datalist>
      </div>
    </section>

    <section>
      <h2>Filters</h2>
      <!-- Reverse swaps shown and filtered-out cells; the note under it (app.js) says so while it is on -->
      <label class="slider" title="Show the cells the filters leave out, and filter out the cells they keep. The ticked values stay as they are. No effect while no filter is set">Reverse <input id="reverse-filters" type="checkbox"></label>
      <p class="hint" id="reverse-note" hidden></p>
      <div id="filters"></div>
      <select id="add-filter" aria-label="Add filter"></select>
    </section>
  </aside>

  <main id="view">
    <!-- One tile per view, over a shared canvas (scene.js); each holds its axis labels, legend, widget and link button -->
    <div id="tiles"></div>
    <!-- With ?embed=1 (a widget on another page) embed.js shows this bar; with compact controls it hides the side
         panel and moves the cell count, color menu, gene box and reset button here -->
    <div id="embed-bar" hidden></div>
    <!-- Shown for a moment when a plain scroll over an embedded view scrolls the page instead of zooming -->
    <div id="zoom-hint" hidden></div>
    <div id="status"></div>
  </main>

  <!-- Legend of the selected view, in its own panel right of the plots -->
  <aside id="legend"></aside>

  <script type="module" src="js/app.js"></script>
</body>
</html>
